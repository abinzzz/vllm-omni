# Single L40S 48 GB, AR-only cache validation.
async_chunk: false
pipeline: mammoth_moda2_ar

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    max_model_len: 4096
    gpu_memory_utilization: 0.8
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    mm_processor_cache_gb: 1
    limit_mm_per_prompt:
      image: 1
